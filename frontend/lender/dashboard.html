<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgroLink — พอร์ทัลผู้ปล่อยกู้</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span>🏦</span><span>AgroLink Platform — พอร์ทัลผู้ปล่อยกู้</span></div>
    <div class="who">
      <span class="name" id="orgName">กำลังโหลด…</span>
      <a href="../manage-roles.html" class="logout-btn" style="text-decoration:none;">จัดการบทบาทธุรกิจ</a>
      <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>

  <div class="container" id="mainContainer">

    <div class="section-title">📊 ภาพรวม</div>
    <div id="summarySection" class="summary-grid">
      <div class="loading-line">กำลังโหลดข้อมูลภาพรวม…</div>
    </div>

    <div class="section-title">🧾 คำขอสินเชื่อที่ต้องดำเนินการ</div>
    <div id="applicationReviewQueueSection" class="card-list">
      <div class="loading-line">กำลังโหลดคำขอสินเชื่อ…</div>
    </div>

    <div class="section-title">📋 ประวัติคำขอสินเชื่อทั้งหมด</div>
    <div class="filter-bar">
      <div class="field">
        <label for="applicationStatusFilter">กรองตามสถานะ</label>
        <select id="applicationStatusFilter">
          <option value="">ทั้งหมด</option>
          <option value="pending">รอการประเมินอัตโนมัติ</option>
          <option value="manual_review">รอตรวจสอบโดยผู้ปล่อยกู้</option>
          <option value="approved">อนุมัติเบื้องต้นแล้ว (รอแปลงเป็นสัญญา)</option>
          <option value="declined">ปฏิเสธแล้ว</option>
          <option value="converted">แปลงเป็นสัญญาแล้ว</option>
        </select>
      </div>
    </div>
    <div id="applicationHistorySection" class="card-list">
      <div class="loading-line">กำลังโหลดประวัติคำขอสินเชื่อ…</div>
    </div>

    <div class="section-title">📑 พอร์ตสัญญาเงินกู้</div>
    <div id="contractListSection" class="card-list">
      <div class="loading-line">กำลังโหลดสัญญาเงินกู้…</div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
