<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgroLink — ดาวเทียมแปลงสมาชิก (พอร์ทัลสหกรณ์)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  body { margin: 0; }
  .sat-wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; box-sizing: border-box; }
  .sat-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .sat-card h2 { margin: 0 0 4px; font-size: 17px; color: var(--green-900); }
  .sat-note { font-size: 12.5px; color: var(--gray-500); margin: 0 0 12px; }
  .sat-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .sat-table th { text-align: left; font-size: 12px; color: var(--gray-500); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--gray-300); white-space: nowrap; }
  .sat-table td { padding: 8px; border-bottom: 1px solid var(--gray-100); }
  .sat-table td.num, .sat-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sat-table tr.pick { cursor: pointer; }
  .sat-table tr.pick:hover td { background: var(--green-100); }
  .sat-table tr.on td { background: var(--gold-100); }
  .sat-scroll { overflow-x: auto; }
  .sat-back { color: #fff; opacity: .85; text-decoration: none; font-size: 13px; margin-right: 12px; }
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><a class="sat-back" href="dashboard.html">← พอร์ทัลสหกรณ์</a>🛰️ ดาวเทียมแปลงสมาชิก</div>
    <div class="who"><span class="name" id="orgName"></span><button class="logout-btn" id="logoutBtn">ออกจากระบบ</button></div>
  </header>
  <div class="sat-wrap">
    <div class="sat-card">
      <h2>แปลงที่ติดตามด้วยดาวเทียม</h2>
      <p class="sat-note">ค่า NDVI จากภาพ Sentinel-2 (Copernicus) เฉพาะวันที่แปลงปลอดเมฆอย่างน้อย 60% — คลิกแปลงเพื่อดูกราฟและภาพดาวเทียม
        ค่ายิ่งสูงยิ่งเขียว: ต่ำกว่า 0.3 = ดิน/พืชเพิ่งงอก/หลังเก็บเกี่ยว, 0.6 ขึ้นไป = พืชเจริญเต็มที่</p>
      <div id="unitList" class="sat-scroll">กำลังโหลด…</div>
    </div>
    <div class="sat-card" id="viewerCard" style="display:none"><div id="viewer"></div></div>
  </div>
<script src="js/api.js"></script>
<script src="../js/satellite-viewer.js"></script>
<script src="js/satellite.js"></script>
</body>
</html>
