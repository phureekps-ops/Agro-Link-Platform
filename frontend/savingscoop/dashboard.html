<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgroLink — พอร์ทัลสหกรณ์ออมทรัพย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span>🏦</span><span>พอร์ทัลสหกรณ์ออมทรัพย์ — สินเชื่อระหว่างสหกรณ์</span></div>
    <div class="who">
      <span class="name" id="orgName">กำลังโหลด…</span>
      <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>
  <div class="cl-wrap">
    <div id="kybBox"></div>
    <div id="sandboxBox"></div>
    <div id="statsBox" class="cl-stats"></div>
    <div class="cl-tabs" id="tabs">
      <button class="cl-tab active" data-tab="queue">📥 รายการรอโอน</button>
      <button class="cl-tab" data-tab="plans">🌾 แผนการผลิตรายงวด</button>
      <button class="cl-tab" data-tab="transfers">🏦 คำสั่งโอน</button>
      <button class="cl-tab" data-tab="applications">📝 คำขอกู้</button>
      <button class="cl-tab" data-tab="assets">🚜 สินเชื่อเครื่องจักร</button>
      <button class="cl-tab" data-tab="facilities">📑 วงเงินที่อนุมัติ</button>
      <button class="cl-tab" data-tab="programs">📢 โครงการให้กู้</button>
      <button class="cl-tab" data-tab="money">💵 รับชำระ &amp; ค่าธรรมเนียม</button>
      <button class="cl-tab" data-tab="setup">⚙️ บัญชีธนาคาร &amp; เจ้าหน้าที่</button>
      <button class="cl-tab" data-tab="notices">🔔 การทวงถาม</button>
    </div>
    <div id="view"></div>
  </div>
  <script src="js/api.js"></script>
  <script src="../js/coop-lending-common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
