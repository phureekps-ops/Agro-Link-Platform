<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>พอร์ทัลคู่ค้าเห็ดฟาง — AgroLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .mp-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .mp-card h3 { margin: 0 0 12px; font-size: 15.5px; color: var(--green-900); }
  .mp-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .mp-table th { text-align: left; font-size: 12px; color: var(--gray-500); padding: 8px; border-bottom: 1px solid var(--gray-300); }
  .mp-table td { padding: 8px; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
  .mp-table .num { text-align: right; }
  .mp-scroll { overflow-x: auto; }
  .mp-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
  .mp-form label { font-size: 12.5px; font-weight: 600; color: var(--gray-700); display: block; margin-bottom: 4px; }
  .mp-form input, .mp-form select { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid var(--gray-300); border-radius: 8px; font: inherit; }
  .mp-btn { border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; background: var(--green-700); color: #fff; }
  .mp-btn.ghost { background: var(--gray-100); color: var(--gray-900); }
  .mp-pill { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; background: var(--gray-100); }
  .mp-pill.ok { background: var(--green-100); color: var(--green-700); }
  .mp-pill.warn { background: var(--gold-100); color: #8a5a00; }
  .mp-empty { color: var(--gray-500); font-size: 13.5px; }
  .mp-msg { display: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .mp-msg.ok { display: block; background: var(--green-100); color: var(--green-700); }
  .mp-msg.err { display: block; background: var(--red-100); color: var(--red-600); }
</style>
</head>
<body>
  <div id="loginView" class="login-page">
    <div class="login-card">
      <div class="login-brand"><span class="leaf">🍄</span><h1>คู่ค้าเห็ดฟาง</h1></div>
      <p class="login-sub">สำหรับผู้ขายเศษวัสดุชีวมวล ผู้ขายเชื้อเห็ดฟาง ผู้ซื้อ (พ่อค้าส่ง/โรงงาน) และผู้ขนส่ง ที่สหกรณ์ผูกบัญชีองค์กรไว้</p>
      <div id="errorBox" class="error-box"></div>
      <form id="loginForm"><div class="field"><label for="claimInput">รหัสยืนยันตัวตนองค์กร (Auth Subject)</label>
        <input id="claimInput" placeholder="oidc|org-..." autocomplete="off" required></div>
        <button class="btn btn-primary">เข้าสู่ระบบ</button></form>
    </div>
  </div>
  <div id="appView" hidden>
    <header class="app-header"><div class="brand">🍄 พอร์ทัลคู่ค้าเห็ดฟาง</div><div class="who"><span class="name" id="whoName"></span><button class="logout-btn" id="logoutBtn">ออกจากระบบ</button></div></header>
    <div class="container"><div id="msg" class="mp-msg"></div><div id="content"><div class="loading-line">กำลังโหลด…</div></div></div>
  </div>
  <script src="js/mushroom-partner.js"></script>
</body>
</html>
