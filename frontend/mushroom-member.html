<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1b3a1f" />
<title>เห็ดฟางของฉัน — AgroLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--gray-50); font-size: 16px; }
  .mm-top { background: var(--green-900); color: #fff; padding: 14px 16px 18px; position: sticky; top: 0; z-index: 5; }
  .mm-top .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .mm-top h1 { font-size: 18px; margin: 0; }
  .mm-top small { color: rgba(255,255,255,.75); }
  .mm-top select { font: inherit; font-size: 14px; border-radius: 8px; border: 0; padding: 6px 8px; max-width: 60%; }
  .mm-wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 96px; }
  .mm-card { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .mm-card h2 { font-size: 16px; margin: 0 0 10px; color: var(--green-900); }
  .mm-prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mm-price { background: var(--green-100); border-radius: 12px; padding: 10px; text-align: center; }
  .mm-price b { display: block; font-size: 24px; color: var(--green-900); }
  .mm-price small { font-size: 12.5px; color: var(--gray-700); }
  .mm-big { font-size: 30px; font-weight: 700; color: var(--green-900); }
  .mm-task { border-left: 4px solid var(--gold-500); background: var(--gold-100); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 15px; }
  .mm-btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-size: 17px; font-weight: 700; background: var(--green-700); color: #fff; cursor: pointer; margin-top: 10px; }
  .mm-btn.ghost { background: var(--gray-100); color: var(--gray-900); }
  .mm-field { margin-bottom: 12px; }
  .mm-field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .mm-field input, .mm-field select, .mm-field textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; padding: 12px; border-radius: 10px; border: 1px solid var(--gray-300); background: #fff; }
  .mm-list { list-style: none; padding: 0; margin: 0; }
  .mm-list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); font-size: 15px; }
  .mm-list li:last-child { border-bottom: 0; }
  .mm-neg { color: var(--red-600); }
  .mm-tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--gray-300); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  .mm-tabs button { border: 0; background: none; font: inherit; font-size: 12.5px; padding: 8px 2px 10px; color: var(--gray-700); cursor: pointer; }
  .mm-tabs button span { display: block; font-size: 22px; }
  .mm-tabs button.active { color: var(--green-700); font-weight: 700; }
  .mm-page { display: none; }
  .mm-page.active { display: block; }
  .mm-msg { padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 15px; display: none; }
  .mm-msg.ok { display: block; background: var(--green-100); color: var(--green-700); }
  .mm-msg.err { display: block; background: var(--red-100); color: var(--red-600); }
  .mm-muted { color: var(--gray-500); font-size: 14px; }
  .mm-chip { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 13px; background: var(--gray-100); }
  .mm-chip.ok { background: var(--green-100); color: var(--green-700); }
  .mm-chip.warn { background: var(--gold-100); color: #8a5a00; }
  .mm-photo { max-width: 100%; border-radius: 10px; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <header class="mm-top">
    <div class="row"><h1>🍄 เห็ดฟางของฉัน</h1><button class="logout-btn" id="logoutBtn">ออก</button></div>
    <div class="row" style="margin-top:6px"><small id="who">กำลังโหลด…</small><select id="memberSel" hidden aria-label="เลือกสหกรณ์"></select></div>
  </header>
  <main class="mm-wrap">
    <div id="msg" class="mm-msg"></div>
    <section class="mm-page active" data-page="home"></section>
    <section class="mm-page" data-page="boxes"></section>
    <section class="mm-page" data-page="report"></section>
    <section class="mm-page" data-page="money"></section>
    <section class="mm-page" data-page="join"></section>
  </main>
  <nav class="mm-tabs" id="tabs">
    <button data-tab="home" class="active"><span>🏠</span>หน้าหลัก</button>
    <button data-tab="boxes"><span>📦</span>จองกล่อง</button>
    <button data-tab="report"><span>📷</span>แจ้งปัญหา</button>
    <button data-tab="money"><span>💰</span>ยอดเงิน</button>
  </nav>
  <script src="js/api.js"></script>
  <script src="js/mushroom-member.js"></script>
</body>
</html>
